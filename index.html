<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>共建河口食物網</title><link rel="stylesheet" href="./docs/web/styles.css?v=20261002-1"></head>
<body>
 <header><div class="heading"><span class="eyebrow">探索・連結・共建</span><h1>共建河口食物網</h1></div><div class="legend"><span class="dot yellow"></span>食物網連線 <span class="dot blue"></span>選取生物的關係</div></header>
 <nav aria-label="食物網操作"><div class="tools"><button id="cancel">取消本次選取 <kbd>Esc</kbd></button><button id="undo">復原上一條連線</button><button id="clear">清除全部連線</button><button id="shuffle">重新排列</button></div><span id="count">0 條連線</span></nav>
 <main><section class="left" aria-label="食物網互動區"><div class="instruction"><span class="step">01</span> 點選起點 <span class="separator">→</span><span class="step">02</span> 點選終點 <span class="help">拖曳圖卡可調整位置</span></div><div id="viewport"><div id="board"><svg id="edges" aria-hidden="true"><defs><marker id="arrow-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f4d351"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#56b5ff"/></marker></defs><g id="paths"></g></svg><div id="cards"></div><div id="loading">正在載入河口圖卡…</div></div></div><footer id="status" role="status" aria-live="polite">先點選一張圖卡，開始探索。</footer></section><aside id="details" aria-label="生物詳細介紹"><div class="empty"><span class="empty-icon">◎</span><p class="eyebrow">認識河口的生命</p><h2>從一張圖卡開始</h2><p>點選左側的生物，查看放大圖與詳細介紹。</p><div class="note">連續點選兩張圖卡，<br>把你的觀察連成食物網。</div></div></aside></main>

 setTimeout(function(){var box=document.getElementById('loading');if(!box.hidden&&!box.querySelector('button')&&box.textContent==='正在載入河口圖卡…'){box.textContent='程式未能載入，請確認 index.html 與 docs 資料夾位於同一位置，並重新整理。';}},15000);
 </script>
