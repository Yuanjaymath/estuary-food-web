<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>共建河口食物網</title><link rel="stylesheet" href="./docs/web/styles.css?v=20261008-large-label"></head>
<body>
 <header><div class="heading"><span class="eyebrow">探索・連結・共建</span><h1>共建河口食物網</h1></div><div class="activity-picker" role="group" aria-label="選擇活動"><button id="activity-1" aria-pressed="true">活動1 · 12項</button><button id="activity-2" aria-pressed="false">活動2 · 24項</button></div><div class="legend"><span class="dot yellow"></span>食物網連線 <span class="dot blue"></span>選取生物的關係</div></header>
 <nav aria-label="食物網操作"><div class="tools"><button id="cancel">取消本次選取 <kbd>Esc</kbd></button><button id="delete-edge" disabled>刪除選取連線</button><button id="undo">復原上一條連線</button><button id="clear">清除全部連線</button><button id="shuffle">重新排列</button><button id="fullscreen" aria-pressed="false">全螢幕</button><label class="size-control" for="card-size">圖卡大小 <input id="card-size" type="range" min="65" max="150" step="5" value="100"><output id="size-value" for="card-size">100%</output></label></div><span class="download-progress"><span id="load-progress" role="status" aria-live="polite"></span> <button id="retry-images" hidden>重試圖卡</button></span><span id="count">0 條連線</span></nav>
 <main><section class="left" aria-label="食物網互動區"><div class="instruction"><span class="step">01</span> 點選起點 <span class="separator">→</span><span class="step">02</span> 點選終點 <span class="help">右側按鈕查看說明；拖曳調整位置；點選箭頭可刪除</span></div><div id="viewport"><div id="board"><svg id="edges" aria-label="食物網連線"><defs><marker id="arrow-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f4d351"/></marker><marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#56b5ff"/></marker></defs><g id="paths"></g></svg><div id="cards"></div><div id="loading">正在載入河口圖卡…</div></div></div><footer id="status" role="status" aria-live="polite">先點選一張圖卡，開始探索。</footer></section><aside id="details" aria-label="生物詳細介紹"><div class="empty"><span class="empty-icon">◎</span><p class="eyebrow">認識河口的生命</p><h2>從一張圖卡開始</h2><p>先點選左側圖卡，再按右側的「查看詳細內容」按鈕，查看放大圖與介紹。</p><div class="note">連續點選兩張圖卡，<br>把你的觀察連成食物網。</div></div></aside></main>
 <script src="./docs/species/offline-data.js?v=20261008-large-label"></script>
 <script src="./docs/web/app.bundle.js?v=20261008-large-label"></script>

</body></html>
